name: Deploy

# Push to `production` -> run the full CI suite from that commit -> if it
# passes, tell the EC2 instance to redeploy via AWS SSM (no inbound SSH).
#
# Required repository secrets:
#   AWS_DEPLOY_ROLE_ARN   IAM role this workflow assumes via GitHub OIDC;
#                         trust policy scoped to this repo + the production ref;
#                         permissions: ssm:SendCommand on the instance and on
#                         document AWS-RunShellScript, plus ssm:GetCommandInvocation
#   AWS_REGION            e.g. us-west-2
#   DEPLOY_INSTANCE_ID    the EC2 instance id (i-0abc...)

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # mint the OIDC token for aws-actions/configure-aws-credentials

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Redeploy via SSM Send-Command
        env:
          INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
        run: |
          set -euo pipefail

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::12} from ${GITHUB_REF_NAME}" \
            --timeout-seconds 120 \
            --parameters '{
              "workingDirectory":["/opt/scitrek/scitrek-bioinformatics"],
              "executionTimeout":["1800"],
              "commands":["sudo -u ubuntu -H DEPLOY_BRANCH=production /opt/scitrek/scitrek-bioinformatics/scripts/deploy.sh"]
            }' \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId: $command_id"

          # Poll until the invocation reaches a terminal state.
          while :; do
            sleep 10
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text)
            echo "status: $status"
            case "$status" in
              Success) break ;;
              Cancelled|TimedOut|Failed|Undeliverable|Terminated)
                echo "::group::SSM stdout"
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text || true
                echo "::endgroup::"
                echo "::group::SSM stderr"
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text || true
                echo "::endgroup::"
                exit 1 ;;
            esac
          done

          echo "::group::SSM stdout"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          echo "::endgroup::"
