x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-service: &backend-service
  image: scitrek-backend:${SCITREK_IMAGE_TAG:-local}
  build:
    context: backend/scitrek_backend
    dockerfile: Dockerfile
  env_file:
    - path: ${SCITREK_BACKEND_ENV_FILE:-backend/scitrek_backend/.env}
      required: false
  environment:
    DJANGO_SETTINGS_MODULE: scitrek_backend.settings.production
    DATABASE_ENGINE: postgresql
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/2}
    DJANGO_HEALTHCHECK_HOST: ${DJANGO_HEALTHCHECK_HOST:-bioinformatics-mod.sci-trek.org}
  init: true
  logging: *default-logging

services:
  init-volumes:
    image: scitrek-backend:${SCITREK_IMAGE_TAG:-local}
    build:
      context: backend/scitrek_backend
      dockerfile: Dockerfile
    user: root
    entrypoint: ["sh", "-c"]
    command: ["chown -R scitrek:scitrek /app/media /app/staticfiles"]
    volumes:
      - media-data:/app/media
      - static-data:/app/staticfiles
    restart: "no"
    logging: *default-logging

  migrate:
    <<: *backend-service
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput
    volumes:
      - static-data:/app/staticfiles
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    restart: "no"

  web:
    <<: *backend-service
    command:
      - gunicorn
      - scitrek_backend.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --access-logfile
      - '-'
      - --error-logfile
      - '-'
      - --capture-output
    expose:
      - "8000"
    volumes:
      - media-data:/app/media
      - static-data:/app/staticfiles:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; r=urllib.request.Request('http://localhost:8000/readyz/', headers={'Host': os.environ['DJANGO_HEALTHCHECK_HOST'], 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(r, timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  worker:
    <<: *backend-service
    command: ["celery", "-A", "scitrek_backend", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      - media-data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A scitrek_backend inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: scitrek-nginx:${SCITREK_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-bioinformatics-mod.sci-trek.org}
      # Empty by default: this deployment has a single hostname. The :- form also
      # substitutes this default when .env sets the key to an empty value.
      TLS_WWW_DOMAIN: ${TLS_WWW_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot:ro
      - static-data:/srv/django-static:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: the official nginx image's entrypoint adds an
      # IPv6 listener whenever /proc/net/if_inet6 exists in the container, which
      # it does even when the container's IPv6 loopback doesn't actually route.
      # wget then resolves "localhost" to ::1 first and gets connection refused,
      # even though the service is healthy over IPv4.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  certbot:
    image: certbot/certbot
    entrypoint: ["/bin/sh", "/usr/local/bin/certbot-renew"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
      - ./scripts/certbot-renew.sh:/usr/local/bin/certbot-renew:ro
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  certbot-etc:
  certbot-var:
  certbot-www:
  media-data:
  redis-data:
  static-data:
